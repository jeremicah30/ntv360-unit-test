<!-- Header -->
<header class="mb-5 flex flex-wrap items-center justify-between gap-4">
  <h1 class="text-2xl font-semibold text-slate-800">Dashboard</h1>
  <div class="flex flex-wrap items-center gap-3">
    <form role="search" class="flex items-center gap-1 rounded-lg bg-white/70 p-1 shadow-sm focus-within:ring-2 focus-within:ring-blue-400" (submit)="$event.preventDefault()">
      <input
        type="search"
        placeholder="Search"
        aria-label="Search orders"
        class="w-48 bg-transparent px-2 text-sm text-slate-700 outline-none placeholder:text-slate-400 lg:w-64"
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />
      <button type="submit" aria-label="Search" class="grid size-8 place-items-center rounded-md bg-blue-500 text-white hover:bg-blue-600">
        <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="M20 20l-3.5-3.5" />
        </svg>
      </button>
    </form>

    <div data-testid="user-badge" class="flex items-center gap-2 rounded-lg bg-white/70 py-1 pl-1 pr-3 shadow-sm">
      <span class="grid size-8 place-items-center rounded-md bg-linear-to-br from-rose-300 to-purple-400 text-xs font-semibold text-white" aria-hidden="true">
        {{ user.initials }}
      </span>
      <span class="text-sm font-medium text-slate-800">{{ user.name }}</span>
      <svg viewBox="0 0 24 24" class="size-4 text-slate-500" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </div>
  </div>
</header>

<div class="grid gap-5 xl:grid-cols-[minmax(0,1fr)_minmax(280px,30%)]">
  <div class="min-w-0 space-y-5">
    <app-summary-cards />
    <app-sales-chart />
    <app-recent-orders [query]="query()" />
  </div>
  <aside class="min-w-0 space-y-5" aria-label="Sales insights">
    <app-sales-donut />
    <app-analytics-chart />
  </aside>
</div>
