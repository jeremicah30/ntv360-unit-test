<!-- Logo + mobile menu toggle -->
<div class="flex items-center justify-between px-3 pt-2 md:mb-8">
  <div class="flex items-center gap-1.5">
    <svg viewBox="0 0 24 24" class="size-7" aria-hidden="true">
      <path d="M5 3h11a3 3 0 0 1 0 6H11v2h4a2.5 2.5 0 0 1 0 5h-4v2h7a3 3 0 0 1 0 6H5z" fill="#2f80ed" />
    </svg>
    <span class="text-lg font-semibold text-slate-800">Shop</span>
  </div>
  <button
    type="button"
    class="rounded-lg p-2 text-slate-700 hover:bg-white/60 focus-visible:outline-2 focus-visible:outline-blue-500 md:hidden"
    aria-controls="sidebar-menu"
    [attr.aria-expanded]="menuOpen()"
    [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
    (click)="menuOpen.set(!menuOpen())"
  >
    <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <path [attr.d]="menuOpen() ? 'M6 6l12 12M18 6 6 18' : 'M4 7h16M4 12h16M4 17h16'" />
    </svg>
  </button>
</div>

<div id="sidebar-menu" class="mt-4 flex-1 flex-col gap-6 md:mt-0 md:flex" [class]="menuOpen() ? 'flex' : 'hidden'">
  <!-- Navigation -->
  <nav aria-label="Main">
    <ul class="space-y-1.5">
      @for (item of items; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="bg-blue-500 text-white shadow-md shadow-blue-500/30"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            #rla="routerLinkActive"
            (click)="menuOpen.set(false)"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"
            [class]="rla.isActive ? '' : 'text-slate-600 hover:bg-white/60 hover:text-slate-900 focus-visible:bg-white/60'"
          >
            <svg
              viewBox="0 0 24 24"
              class="size-4 shrink-0"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              @for (d of item.icon; track $index) {
                <path [attr.d]="d" />
              }
            </svg>
            {{ item.label }}
          </a>
        </li>
      }
    </ul>
  </nav>

  <!-- Upgrade card -->
  <aside data-testid="upgrade-card" class="mt-auto rounded-2xl bg-linear-to-b from-sky-100/90 to-white/70 p-4 shadow-sm" aria-label="Upgrade">
    <div class="-mt-8 mb-2 text-5xl drop-shadow-md" aria-hidden="true">👍</div>
    <p class="text-sm font-medium text-slate-800">Upgrade to <span class="font-semibold">Pro</span> to get all features</p>
    <button
      type="button"
      class="mt-3 flex items-center gap-2 rounded text-sm font-medium text-blue-500 hover:text-blue-600 focus-visible:outline-2 focus-visible:outline-blue-500"
    >
      Upgrade Now
      <svg viewBox="0 0 24 24" class="size-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" />
      </svg>
    </button>
  </aside>

  <!-- Log out -->
  <button
    type="button"
    (click)="logout()"
    class="mt-2 flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm text-slate-700 transition-colors hover:bg-white/60 focus-visible:bg-white/60 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500"
  >
    <svg
      viewBox="0 0 24 24"
      class="size-4"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      @for (d of logoutIcon; track $index) {
        <path [attr.d]="d" />
      }
    </svg>
    Log Out
  </button>
</div>
